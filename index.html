<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ДУРДОМ ПАЛАТА 6 | Hub</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
            /* Добавим легкий фоновый градиент для атмосферы */
            background-image: radial-gradient(circle at center, #1a0000 0%, #050505 70%);
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            font-family: 'Times New Roman', serif;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #8b0000;
            margin-top: 40px;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseTitle 3s infinite alternate;
        }
        
        @keyframes pulseTitle {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #8b0000; }
            100% { text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; }
        }

        .subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 25px 20px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
        .card h3 {
            margin: 0 0 15px 0;
            color: #d4b470;
            font-size: 1.5rem;
            font-family: 'Times New Roman', serif;
        }
        .card p {
            font-size: 1rem; 
            color: #ccc; 
            margin: 0;
            line-height: 1.6;
        }
        
        /* Кнопки */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            display: block;
            background-color: #ff0000;
            color: #000;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            transition: all 0.3s ease;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn:hover {
            background-color: #fff;
            box-shadow: 0 0 25px #fff;
            transform: scale(1.02);
        }

        .btn-outline {
            background-color: transparent;
            color: #ff0000;
            border: 2px solid #ff0000;
            box-shadow: none;
        }

        .btn-outline:hover {
            background-color: #ff0000;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

    </style>
</head>
<body>

    <h1>ДУРДОМ ПАЛАТА 6</h1>
    <div class="subtitle">ТЕМНЫЙ КУЛЬТ ИИ-КОМПОЗИТОРОВ</div>

    <div class="card">
        <h3>🦇 Манифест</h3>
        <p>ОТКРЫТЫЙ КУЛЬТ ТВОРЧЕСКИХ ЛЮДЕЙ.<br><br>ЗДЕСЬ КАЖДЫЙ АГНЕЦ ПИШЕТ РУКАМИ СВОЮ ТЕМНУЮ ИСТОРИЮ.</p>
    </div>

    <!-- Кнопки навигации -->
    <div class="btn-container">
        <a href="https://t.me/+oiomDYa-RodmOGEy" target="_blank" class="btn">💬 Войти в наш чат</a>
        <a href="https://lipatow1991-coder.github.io/notes-iskareotus-/" target="_blank" class="btn btn-outline">🎧 Проект NOTES ISKAREOTUS</a>
    </div>

    <script>
        // Инициализация Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand(); 
        tg.setHeaderColor('#050505'); 
        tg.setBackgroundColor('#050505'); 
    </script>
</body>
</html>
